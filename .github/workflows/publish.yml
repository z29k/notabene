name: Publish

# One workflow, two channels × two registries (npm allows a single Trusted Publisher per
# package, so both channels must run from this file — the one registered on npmjs.com):
#   • push to `develop`      → prerelease `X.Y.Z-dev.N` on the `dev` dist-tag   (staging)
#   • push a `vX.Y.Z` tag    → stable `X.Y.Z` on `latest` + a GitHub Release    (production)
#
# Each publish runs twice, once per registry:
#   • npmjs.org           → canonical, anonymously installable. Auth = trusted publishing
#                           (OIDC) — no stored token, provenance automatic.
#   • npm.pkg.github.com  → mirror that fills the repo's Packages section. Auth = the built-in
#                           GITHUB_TOKEN (`packages: write`). No provenance, and installing from
#                           it needs a GitHub PAT (`read:packages`) even though it's public — so
#                           npmjs stays the real distribution channel; this one is a vitrine.
# The job runs in the `production` GitHub Environment to match the Trusted Publisher config.
#
# One-time setup (owner): npmjs.com → @z29k/notabene → Settings → Trusted Publisher →
# repo `z29k/notabene`, workflow `publish.yml`, environment `production`.
on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch: {}

# Serialize every publish. npm rejects concurrent packument writes with a 409 ("Failed to save
# packument"): a release pushes the `vX.Y.Z` tag (stable @latest) and `develop` (prerelease @dev)
# near-simultaneously, so without this the two runs race and one fails. A STATIC group makes all
# Publish runs share it; `cancel-in-progress: false` queues the second run instead of cancelling
# it — a publish must never be interrupted mid-flight.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC for npm trusted publishing + provenance
      packages: write # publish the mirror to GitHub Packages (npm.pkg.github.com)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5. Pin the 11.x line: npm 12.0.x drops the bundled
      # `sigstore` module on global install, which breaks provenance signing at publish time
      # (npm error "Cannot find module 'sigstore'"). Revisit once 12.x is fixed.
      - name: Pin npm 11.x (>= 11.5, avoids the 12.0.x provenance/sigstore break)
        run: npm install -g 'npm@^11.5'
      - run: npm ci

      # Same gates as CI — never publish something that doesn't pass.
      - name: Lint
        run: npm run lint
        working-directory: packages/renderer
      - name: Test
        run: npm test
        working-directory: packages/renderer
      - name: Prepare a scratch consumer
        run: |
          set -e
          mkdir -p /tmp/consumer/docs
          printf '# Hello\n\nGFM hostile to MDX: Promise<T>, <a@b.com>, {x}, | a | b |\n' > /tmp/consumer/docs/index.md
          node packages/renderer/bin/notabene.mjs init --root /tmp/consumer
      - name: Type-check
        run: npm run check
        working-directory: packages/renderer
        env:
          NOTABENE_ROOT: /tmp/consumer
          NOTABENE_CONFIG: /tmp/consumer/notabene.config.mjs
      - name: Smoke build
        run: node packages/renderer/bin/notabene.mjs build --root /tmp/consumer
      - name: Smoke build (public artifact, leak checks)
        # Keep this block IDENTICAL to ci.yml's — publish runs independently of CI
        # on the same push, so a weaker gate here could publish what CI rejects.
        run: |
          set -e
          mkdir -p /tmp/consumer/docs/.notabene/docs/index
          printf '{ "id": "c-leak", "space": "docs", "page": "docs/index", "scope": "page", "anchor": null, "thread": [{ "author": "CI <ci@example.com>", "body": "LEAKCANARY-not-for-public", "ts": "2026-01-01T00:00:00Z" }], "status": "open", "hold": false, "resolution": null, "createdAt": "2026-01-01T00:00:00Z", "updatedAt": "2026-01-01T00:00:00Z" }\n' > /tmp/consumer/docs/.notabene/docs/index/c-leak.json
          # One canary per scoping knob: frontmatter page · private space · excluded glob.
          printf -- '---\npublish: false\n---\n\n# Private\n\nPRIVATECANARY page excluded from public builds.\n' > /tmp/consumer/docs/private.md
          mkdir -p /tmp/consumer/notes /tmp/consumer/docs/wip
          printf '# Notes\n\nSPACECANARY private space.\n' > /tmp/consumer/notes/index.md
          printf '# Draft\n\nGLOBCANARY excluded sub-tree.\n' > /tmp/consumer/docs/wip/draft.md
          # Bilingual (suffix strategy): a FR home → per-locale llms/twins/hreflang; a FR
          # sibling of the glob-excluded page → scoping hides EVERY translation at once.
          printf '# Accueil\n\nVersion française de la page d accueil.\n' > /tmp/consumer/docs/index.fr.md
          printf '# Brouillon\n\nGLOBCANARY sous-arbre exclu (FR).\n' > /tmp/consumer/docs/wip/draft.fr.md
          # Custom home page: rendered on "/" above the space cards (public + normal).
          printf '# Welcome\n\nHOMECANARY custom landing content.\n' > /tmp/consumer/home.md
          printf '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8"><rect width="8" height="8" fill="navy"/></svg>' > /tmp/consumer/brand.svg
          printf ':root{--nb-accent:#ff00aa}' > /tmp/consumer/theme.css
          # Consumer asset FOLDER (theme.assets): a font is served, a dotfile never is.
          mkdir -p /tmp/consumer/theme-assets/fonts
          printf 'FONTBYTES' > /tmp/consumer/theme-assets/fonts/x.woff2
          printf 'ASSETCANARY=secret' > /tmp/consumer/theme-assets/secrets.env
          cat > /tmp/consumer/notabene.config.mjs << 'CFG'
          export default {
            siteName: "CI",
            format: "commonmark",
            roots: [
              { key: "docs", label: "Docs", path: "docs", exclude: [".notabene/**"] },
              { key: "notes", label: "Notes", path: "notes", publish: false },
            ],
            store: "docs/.notabene",
            editPattern: "https://github.com/ci/repo/edit/main/{path}",
            home: "home.md",
            branding: { logo: "brand.svg", favicon: "brand.svg", socialImage: "brand.svg" },
            theme: { css: "theme.css", tokens: { accent: "#00ff99" }, assets: "theme-assets" },
            nav: {
              header: [
                { label: "GitHub", href: "https://github.com/ci/repo", icon: "github", iconOnly: true },
                { label: "Internal", href: "https://navcanary.example", publish: false },
              ],
              sidebar: {
                title: { en: "Resources", fr: "Ressources" },
                links: [{ label: "Releases", href: "https://github.com/ci/repo/releases", icon: "star" }],
              },
              footer: { links: [{ label: "Home", href: "/docs/index" }], text: "FOOTERCANARY", poweredBy: true },
            },
            i18n: { locales: ["en", "fr"], defaultLocale: "en", strategy: "suffix" },
            publish: { exclude: ["docs/wip/**"] },
          };
          CFG
          node packages/renderer/bin/notabene.mjs build --root /tmp/consumer --public \
            --site https://ci.example.com --base /repo --out /tmp/public-site
          # Present: the reading site + the agent surface, in BOTH locales.
          for f in index.html 404.html llms.txt llms-full.txt robots.txt sitemap-index.xml .nojekyll \
                   docs/index/index.md fr/llms.txt fr/llms-full.txt fr/docs/index/index.md; do
            test -f "/tmp/public-site/$f" || { echo "MISSING: $f"; exit 1; }
          done
          grep -q 'hreflang="fr" href="https://ci.example.com/repo/fr/' /tmp/public-site/docs/index/index.html \
            || { echo "MISSING: absolute FR hreflang"; exit 1; }
          # Absent: store data, review/identity chrome, any /api surface, server bundle,
          # and everything scoped private (page / space / glob).
          ! grep -RIq "LEAKCANARY" /tmp/public-site || { echo "LEAK: store data in public artifact"; exit 1; }
          for canary in PRIVATECANARY SPACECANARY GLOBCANARY; do
            ! grep -RIq "$canary" /tmp/public-site || { echo "LEAK: $canary content in public artifact"; exit 1; }
          done
          test ! -e /tmp/public-site/docs/private && test ! -e /tmp/public-site/notes && test ! -e /tmp/public-site/docs/wip
          for pat in nb-identity-dialog notabene-me /api/comments /api/journal /api/diff; do
            ! grep -RIq -- "$pat" /tmp/public-site || { echo "LEAK: $pat in public artifact"; exit 1; }
          done
          test ! -e /tmp/public-site/journal && test ! -e /tmp/public-site/comments && test ! -e /tmp/public-site/review
          # Base prefix applied to emitted links.
          grep -q "HOMECANARY" /tmp/public-site/index.html || { echo "MISSING: custom home content on /"; exit 1; }
          # Branding: assets emitted + favicon/logo/og wired into the pages.
          for a in favicon.svg logo.svg og.svg; do test -f "/tmp/public-site/_nb/$a" || { echo "MISSING: /_nb/$a"; exit 1; }; done
          grep -q 'rel="icon" type="image/svg+xml" href="/repo/_nb/favicon.svg"' /tmp/public-site/index.html || { echo "MISSING: favicon link"; exit 1; }
          grep -q 'class="brand-logo" src="/repo/_nb/logo.svg"' /tmp/public-site/index.html || { echo "MISSING: topbar logo"; exit 1; }
          grep -q 'property="og:image" content="https://ci.example.com/repo/_nb/og.svg"' /tmp/public-site/index.html || { echo "MISSING: og:image"; exit 1; }
          # Theming: consumer stylesheet served + inline token overrides + layered base.
          grep -q -- '--nb-accent:#ff00aa' /tmp/public-site/_nb/theme.css || { echo "MISSING: theme.css"; exit 1; }
          grep -q 'stylesheet" href="/repo/_nb/theme.css"' /tmp/public-site/index.html || { echo "MISSING: theme link"; exit 1; }
          grep -q -- ':root{--nb-accent:#00ff99}' /tmp/public-site/index.html || { echo "MISSING: inline tokens"; exit 1; }
          # theme.assets: served under the FIXED mount point; refused files never emitted.
          test -f /tmp/public-site/_nb/assets/fonts/x.woff2 || { echo "MISSING: theme asset"; exit 1; }
          test ! -e /tmp/public-site/_nb/assets/secrets.env || { echo "LEAK: dotfile served from theme.assets"; exit 1; }
          ! grep -RIq "ASSETCANARY" /tmp/public-site || { echo "LEAK: theme.assets non-asset file"; exit 1; }
          grep -q 'https://github.com/ci/repo/edit/main/docs/index.md' /tmp/public-site/docs/index/index.html || { echo "MISSING: edit link"; exit 1; }
          # Outbound nav (config `nav`): identity, so PRESENT in a public artifact — topbar
          # icon, sidebar block (per-locale title) and footer, with `base` on site paths.
          grep -q 'href="https://github.com/ci/repo" class="topbar-link topbar-util nb-nav-link' /tmp/public-site/index.html || { echo "MISSING: topbar nav link"; exit 1; }
          grep -q 'class="nb-sidebar-links"' /tmp/public-site/docs/index/index.html || { echo "MISSING: sidebar nav block"; exit 1; }
          grep -q 'Ressources' /tmp/public-site/fr/docs/index/index.html || { echo "MISSING: per-locale nav title"; exit 1; }
          grep -q 'FOOTERCANARY' /tmp/public-site/index.html || { echo "MISSING: site footer"; exit 1; }
          grep -q 'class="nb-nav-link nb-footer-link" *href="/repo/docs/index"\|href="/repo/docs/index" class="nb-nav-link nb-footer-link"' /tmp/public-site/index.html || { echo "MISSING: based footer link"; exit 1; }
          # …except a `publish: false` link, which must never reach the artifact.
          ! grep -RIq "navcanary.example" /tmp/public-site || { echo "LEAK: publish:false nav link in public artifact"; exit 1; }
          grep -q "@layer nb-base" /tmp/public-site/_astro/*.css || { echo "MISSING: layered renderer styles"; exit 1; }
          # Scheme toggle: pre-paint forcing script, toggle button, light-dark() tokens.
          grep -q "nb-scheme" /tmp/public-site/index.html || { echo "MISSING: scheme init script"; exit 1; }
          grep -q "js-scheme-toggle" /tmp/public-site/index.html || { echo "MISSING: scheme toggle button"; exit 1; }
          grep -q "light-dark(" /tmp/public-site/_astro/*.css || { echo "MISSING: light-dark() tokens"; exit 1; }
          grep -q 'href="/repo/' /tmp/public-site/index.html || { echo "MISSING: base prefix on links"; exit 1; }
          grep -q 'https://ci.example.com/repo/' /tmp/public-site/llms.txt || { echo "MISSING: absolute URLs in llms.txt"; exit 1; }
          # Pagefind (optional dep, present via the workspace root): bundle emitted, one
          # index per locale, and no scoped/store content in the fragments — they are
          # gzip (the -RIq sweeps above SKIP binaries), so decompress before grepping.
          test -f /tmp/public-site/pagefind/pagefind.js || { echo "MISSING: pagefind bundle"; exit 1; }
          python3 - <<'PF'
          import glob, gzip, json
          entry = json.load(open("/tmp/public-site/pagefind/pagefind-entry.json"))
          langs = entry["languages"]
          assert "en" in langs and "fr" in langs and all(v["page_count"] > 0 for v in langs.values()), langs
          frags = glob.glob("/tmp/public-site/pagefind/fragment/*.pf_fragment")
          assert frags, "no pagefind fragments"
          bad = []
          for f in frags:
              body = gzip.decompress(open(f, "rb").read()).decode("utf-8", "replace")
              url = json.loads(body[len("pagefind_dcd"):])["url"]
              bad += [(c, url) for c in ("LEAKCANARY", "PRIVATECANARY", "SPACECANARY", "GLOBCANARY") if c in body]
              if "/print/" in url or "/404" in url: bad.append(("non-doc route indexed", url))
          assert not bad, bad
          PF
          # Origin-agnostic mode (domain managed server-side): no --site → no sitemap,
          # no Sitemap line in robots.txt, root-relative llms/twin links, and NOT ONE
          # absolute origin baked anywhere in the artifact.
          node packages/renderer/bin/notabene.mjs build --root /tmp/consumer --public \
            --base /repo --out /tmp/public-relative
          test -f /tmp/public-relative/llms.txt && test ! -e /tmp/public-relative/sitemap-index.xml
          ! grep -q "Sitemap:" /tmp/public-relative/robots.txt || { echo "robots.txt points at a sitemap that is not emitted"; exit 1; }
          grep -q '](/repo/docs/index/index.md)' /tmp/public-relative/llms.txt || { echo "MISSING: root-relative llms links"; exit 1; }
          ! grep -RIq "https://ci.example.com" /tmp/public-relative || { echo "LEAK: baked origin in origin-agnostic artifact"; exit 1; }
          # Scoping must not affect normal builds — rebuild non-public with the
          # publish:false page present.
          node packages/renderer/bin/notabene.mjs build --root /tmp/consumer
          # Link lint: green against the fresh normal truth, then a seeded dead link
          # must fail it with a diagnostic.
          node packages/renderer/bin/notabene.mjs lint --root /tmp/consumer
          printf '\n[dead](./nope.md)\n' >> /tmp/consumer/docs/index.md
          if node packages/renderer/bin/notabene.mjs lint --root /tmp/consumer > /tmp/lint.out 2>&1; then
            echo "lint should have failed on a dead link"; exit 1;
          fi
          grep -q "does not exist" /tmp/lint.out || { echo "MISSING: lint diagnostic"; exit 1; }
          # DEV full-text search: the dev server serves a LIVE Pagefind index built from
          # the sources (addCustomRecord — no build involved), one index per locale.
          node packages/renderer/bin/notabene.mjs dev --root /tmp/consumer --detach --port 3111
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3111/pagefind/pagefind-entry.json -o /tmp/dev-entry.json && break
            sleep 2
          done
          node packages/renderer/bin/notabene.mjs stop --root /tmp/consumer
          python3 - <<'DEVPF'
          import json
          langs = json.load(open("/tmp/dev-entry.json"))["languages"]
          assert "en" in langs and "fr" in langs and all(v["page_count"] > 0 for v in langs.values()), langs
          DEVPF

      # ── production: vX.Y.Z tag → stable @latest + GitHub Release ──────────────
      - name: Verify the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/renderer/package.json').version")
          echo "tag=$TAG package=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }
      - name: Publish stable to npm (@latest)
        if: github.ref_type == 'tag'
        working-directory: packages/renderer
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "@z29k/notabene@$PKG" version >/dev/null 2>&1; then
            echo "@z29k/notabene@$PKG is already published — skipping."
          else
            npm publish --access public
          fi
      # Mirror the same stable tarball to GitHub Packages so the repo's Packages section
      # tracks releases. Registry + auth go via CLI flags (highest precedence) rather than
      # `npm config set`, which errors ENOWORKSPACES from inside a workspace member. No
      # provenance on this registry.
      - name: Mirror stable to GitHub Packages
        if: github.ref_type == 'tag'
        working-directory: packages/renderer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          AUTH="--//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          if npm view "@z29k/notabene@$PKG" --registry https://npm.pkg.github.com "$AUTH" version >/dev/null 2>&1; then
            echo "@z29k/notabene@$PKG already on GitHub Packages — skipping."
          else
            npm publish --registry https://npm.pkg.github.com "$AUTH" --no-provenance
          fi
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — leaving it."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # ── staging: push to develop → prerelease @dev ───────────────────────────
      - name: Publish prerelease to npm (@dev)
        if: github.ref_type == 'branch' && github.ref_name == 'develop'
        working-directory: packages/renderer
        run: |
          BASE=$(node -p "require('./package.json').version")
          BASE="${BASE%%-*}"
          VER="${BASE}-dev.${GITHUB_RUN_NUMBER}"
          echo "publishing $VER to @dev"
          npm version "$VER" --no-git-tag-version
          npm publish --tag dev --access public
      # Mirror the just-bumped prerelease (package.json now holds X.Y.Z-dev.N) to GitHub Packages.
      - name: Mirror prerelease to GitHub Packages (@dev)
        if: github.ref_type == 'branch' && github.ref_name == 'develop'
        working-directory: packages/renderer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH="--//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          npm publish --tag dev --registry https://npm.pkg.github.com "$AUTH" --no-provenance
